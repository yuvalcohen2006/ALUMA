[functions]
  # Supabase Auth calls this server-side with no user JWT — it authenticates
  # itself with a Standard Webhooks signature instead (SEND_EMAIL_HOOK_SECRET).
  [functions.auth-email-hook]
    verify_jwt = false
  # Public contact form: anonymous visitors post to it, so no JWT is required.
  # It defends itself with schema validation, a honeypot and IP rate limiting.
  [functions.submit-contact]
    verify_jwt = false
  # Admin-only: must be called with a signed-in admin's JWT.
  [functions.invite-admin]
    verify_jwt = true
